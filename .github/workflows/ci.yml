name: Build and check
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / .NET 8
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify required runtime assets
        run: python tools/verify_runtime_assets.py
      - name: Validate procedural model pipeline
        run: python tools/test_ship_model_pipeline.py
      - name: Restore packages
        run: dotnet restore StarlightSyndicate.sln
      - name: Build project
        run: dotnet build StarlightSyndicate.sln --no-restore --configuration Release
      - name: Q systems regression
        run: dotnet run --project Source/StarlightSyndicate.csproj --configuration Release --no-build -- --stage-q-selftest
