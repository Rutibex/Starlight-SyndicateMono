name: Bug report
description: Report an issue that can be reproduced in the current game.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start new game ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / build version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System details and diagnostic output
      description: Windows version, .NET version, graphics card, relevant error. Do not share private saved data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have reviewed existing issues and the known limitations.
          required: true
